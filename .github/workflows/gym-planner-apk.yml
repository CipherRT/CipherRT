# Builds the Gym Planner APK on every push, so you can download it without an Android setup.
# Find it under: GitHub → Actions → latest "Gym Planner APK" run → Artifacts.
#
# Signed release APK (optional): add these repository secrets
#   (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   – your .jks file, base64-encoded (see GymPlanner/README.md)
#   KEYSTORE_PASSWORD – keystore password
#   KEY_ALIAS         – key alias (gymplanner if you used scripts/make-release-key.sh)
#   KEY_PASSWORD      – key password
name: Gym Planner APK

on:
  push:
    paths:
      - "GymPlanner/**"
      - ".github/workflows/gym-planner-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GymPlanner
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gym-planner-debug-apk
          path: GymPlanner/app/build/outputs/apk/debug/app-debug.apk

      - name: Signed release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          ./gradlew assembleRelease
          rm -f release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: gym-planner-release-apk
          path: GymPlanner/app/build/outputs/apk/release/app-release.apk
